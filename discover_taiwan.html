<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>探索台灣 - 智慧行程與交通導航助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom UI Adjustments for Mobile App feel */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-tab {
      color: #2dd4bf;
      border-bottom: 2px solid #2dd4bf;
    }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans antialiased overflow-x-hidden selection:bg-brand-500 selection:text-white">

  <!-- Top App Header -->
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
        <i class="fa-solid fa-compass text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight leading-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
          探索台灣 <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400 border border-brand-500/30">PRO</span>
        </h1>
        <p class="text-[11px] text-slate-400 flex items-center gap-1">
          <i class="fa-solid fa-location-dot text-brand-400 text-[10px]"></i> 一鍵開啟 Google Maps 交通導航
        </p>
      </div>
    </div>

    <!-- Quick Actions Header Buttons -->
    <div class="flex items-center gap-2">
      <button onclick="openFullDayMaps()" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-medium text-xs shadow-md shadow-emerald-900/30 flex items-center gap-1.5 active:scale-95 transition">
        <i class="fa-brands fa-chrome text-sm"></i>
        <span class="hidden sm:inline">開啟整日</span>路線
      </button>
    </div>
  </header>

  <!-- Main Application Area -->
  <main class="flex-1 max-w-2xl w-full mx-auto pb-24 px-3 sm:px-4 pt-3 space-y-4">

    <!-- Segmented Control Tabs for Mobile -->
    <div class="grid grid-cols-3 gap-1 p-1 bg-slate-800/80 rounded-2xl border border-slate-700/50 backdrop-blur-md">
      <button onclick="switchTab('itinerary')" id="tab-btn-itinerary" class="py-2 text-xs sm:text-sm font-semibold rounded-xl text-brand-400 bg-slate-700/80 shadow-sm transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-route"></i> 我的行程
      </button>
      <button onclick="switchTab('presets')" id="tab-btn-presets" class="py-2 text-xs sm:text-sm font-semibold rounded-xl text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-fire text-amber-400"></i> 熱門方案
      </button>
      <button onclick="switchTab('assistant')" id="tab-btn-assistant" class="py-2 text-xs sm:text-sm font-semibold rounded-xl text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-1.5 relative">
        <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> AI 助手
        <span class="w-2 h-2 rounded-full bg-purple-500 absolute top-2 right-2 animate-pulse"></span>
      </button>
    </div>

    <!-- TAB 1: ITINERARY VIEW -->
    <div id="tab-content-itinerary" class="space-y-4">
      
      <!-- Summary Bar -->
      <div class="glass-card rounded-2xl p-3.5 border border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="text-center px-2 py-1 bg-slate-800/80 rounded-xl border border-slate-700/60">
            <div id="spot-count" class="text-lg font-extrabold text-brand-400">0</div>
            <div class="text-[10px] text-slate-400">景點數</div>
          </div>
          <div>
            <h2 id="current-route-title" class="text-sm font-bold text-slate-100">客製化玩台行程</h2>
            <p id="total-travel-est" class="text-xs text-slate-400 flex items-center gap-1 mt-0.5">
              <i class="fa-regular fa-clock text-slate-400"></i> 預估移動約 0 分鐘
            </p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="openAddSpotModal()" class="p-2 bg-brand-500/20 hover:bg-brand-500/30 text-brand-400 border border-brand-500/30 rounded-xl active:scale-95 transition text-xs font-medium flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> 新增景點
          </button>
          <button onclick="confirmClearAll()" class="p-2 bg-slate-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-700 rounded-xl active:scale-95 transition text-xs" title="清空行程">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </div>

      <!-- Itinerary Spot Cards List with Dynamic Route Legs -->
      <div id="itinerary-list-container" class="space-y-3">
        <!-- Rendered via JavaScript -->
      </div>
    </div>

    <!-- TAB 2: PRESET PACKAGES (KKday / Klook Style) -->
    <div id="tab-content-presets" class="hidden space-y-4">
      <div class="text-xs text-slate-400 flex items-center justify-between px-1">
        <span>精選 KKday / Klook 熱門玩樂路線</span>
        <span>點擊「套用」即刻規劃</span>
      </div>

      <div class="grid grid-cols-1 gap-4" id="presets-grid">
        <!-- Presets rendered via JS -->
      </div>
    </div>

    <!-- TAB 3: AI TRAVEL ASSISTANT & SPOT RECOMMENDATIONS -->
    <div id="tab-content-assistant" class="hidden space-y-4">
      
      <!-- AI Interactive Card -->
      <div class="glass-card rounded-2xl p-4 border border-purple-500/20 bg-gradient-to-b from-purple-900/20 to-slate-900/60 space-y-3">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30">
            <i class="fa-solid fa-robot text-lg"></i>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white">台灣旅遊 AI 導覽助手</h3>
            <p class="text-xs text-slate-400">告訴我想去哪裡或需求（例如：夜市、溫泉、親子景點）</p>
          </div>
        </div>

        <!-- Quick Filter Badges -->
        <div class="flex flex-wrap gap-1.5 pt-1">
          <button onclick="askAIAssistant('台北人氣夜市巡禮')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-purple-900/40 border border-slate-700 text-xs text-slate-300 transition">
            🌙 台北人氣夜市
          </button>
          <button onclick="askAIAssistant('北台灣溫泉放鬆行程')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-purple-900/40 border border-slate-700 text-xs text-slate-300 transition">
            ♨️ 北投/礁溪溫泉
          </button>
          <button onclick="askAIAssistant('適合全家出遊的親子景點')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-purple-900/40 border border-slate-700 text-xs text-slate-300 transition">
            👶 親子遊樂園
          </button>
          <button onclick="askAIAssistant('台中文青文創景點')" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-purple-900/40 border border-slate-700 text-xs text-slate-300 transition">
            🎨 台中文青打卡
          </button>
        </div>

        <!-- AI Chat Log / Output -->
        <div id="ai-output-box" class="p-3 bg-slate-950/70 rounded-xl border border-slate-800 min-h-[160px] text-xs space-y-2 text-slate-300 leading-relaxed overflow-y-auto max-h-[250px]">
          <p class="text-slate-500 italic text-center py-6">👉 在下方輸入您想去的地方，或是點選上方熱門主題，AI 助手會即時給出行程建議並協助加入！</p>
        </div>

        <!-- AI Input Form -->
        <div class="flex gap-2 pt-1">
          <input type="text" id="ai-query-input" placeholder="例如: 我想去花蓮太魯閣看山海景點..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
          <button onclick="handleAISubmit()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-medium rounded-xl text-xs shadow-md transition active:scale-95">
            發送
          </button>
        </div>
      </div>

      <!-- Quick Spot Explorer Database Cards -->
      <div>
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">全台熱門景點快選庫</h4>
        <div id="spot-explorer-grid" class="grid grid-cols-2 gap-2.5">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>

  </main>

  <!-- Fixed Floating Navigation & Action Bar for Mobile -->
  <div class="fixed bottom-0 left-0 right-0 z-40 p-3 glass-panel border-t border-slate-800/80">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <button onclick="openFullDayMaps()" class="flex-1 py-2.5 bg-gradient-to-r from-brand-600 to-emerald-500 hover:from-brand-500 hover:to-emerald-400 text-white rounded-xl font-bold text-xs sm:text-sm shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 active:scale-95 transition">
        <i class="fa-brands fa-chrome text-base"></i>
        <span>開啟完整全天 Google 導航</span>
      </button>

      <button onclick="openAddSpotModal()" class="px-3.5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-medium text-xs border border-slate-700 flex items-center justify-center gap-1 active:scale-95 transition">
        <i class="fa-solid fa-plus text-brand-400"></i>
        <span>加景點</span>
      </button>
    </div>
  </div>

  <!-- MODAL 1: Transport Route Comparison Modal -->
  <div id="transport-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center">
            <i class="fa-solid fa-route text-sm"></i>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white" id="modal-route-title">地點 A ➔ 地點 B 交通評估</h3>
            <p class="text-[11px] text-slate-400">分析全交通方式時間與花費建議</p>
          </div>
        </div>
        <button onclick="closeTransportModal()" class="p-1.5 text-slate-400 hover:text-white rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-4 space-y-3 max-h-[70vh] overflow-y-auto" id="modal-transport-options">
        <!-- Rendered dynamically -->
      </div>

      <div class="p-3 bg-slate-950/80 border-t border-slate-800 flex gap-2">
        <button id="modal-google-maps-btn" onclick="" class="w-full py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl flex items-center justify-center gap-2 transition">
          <i class="fa-brands fa-chrome"></i> 開啟此段 Google 地圖導航
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: Add Custom Spot Modal -->
  <div id="add-spot-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-brand-400"></i> 新增自訂景點
        </h3>
        <button onclick="closeAddSpotModal()" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">景點名稱 *</label>
          <input type="text" id="custom-name" placeholder="例如：士林夜市 或 華山文創園區" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">簡短介紹 / 推薦必吃必玩</label>
          <input type="text" id="custom-desc" placeholder="例如：必吃胡椒餅、生蚵煎，品嚐米其林小吃" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">彩色圖片網址 (可留空，自動匹配預設圖)</label>
          <input type="text" id="custom-img" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">所在縣市 / 區域</label>
          <select id="custom-region" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-brand-500">
            <option value="北部">北部 (台北/新北/基隆/宜蘭/桃園)</option>
            <option value="中部">中部 (台中/南投/彰化)</option>
            <option value="南部">南部 (台南/高雄/屏東)</option>
            <option value="東部">東部 (花蓮/台東)</option>
          </select>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeAddSpotModal()" class="flex-1 py-2 bg-slate-800 text-slate-300 text-xs font-medium rounded-xl">取消</button>
        <button onclick="submitCustomSpot()" class="flex-1 py-2 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl shadow-md">確定新增</button>
      </div>
    </div>
  </div>

        subtitle: '野柳地質公園 ➔ 十分放天燈 ➔ 九份老街 ➔ 台北101觀景台',
        spots: ['yehliu', 'shifen', 'jiufen', 'tpe101']
      },
      {
        id: 'pkg-central-south',
        tag: 'Klook 深度自然推薦',
        tagColor: 'from-emerald-500 to-teal-500',
        title: '方案 B：中南部湖光山色古都巡禮',
        subtitle: '彩虹眷村 ➔ 日月潭纜車與遊湖 ➔ 阿里山小火車 ➔ 奇美博物館',
        spots: ['rainbow', 'sml', 'alishan', 'chimei']
      },
      {
        id: 'pkg-east',
        tag: '戶外秘境熱門',
        tagColor: 'from-blue-500 to-indigo-500',
        title: '方案 C：花東太平洋海岸壯麗巡禮',
        subtitle: '太魯閣峽谷 ➔ 清水斷崖 & 七星潭',
        spots: ['taroko', 'qixing']
      }
    ];

    /* ==========================================================================
       GLOBAL STATE & INITIALIZATION
       ========================================================================== */
    let currentItinerary = [];

    window.addEventListener('DOMContentLoaded', () => {
      // Load Default North Taiwan Tour Preset
      loadPresetRoute('pkg-north');
      renderExplorerGrid();
      renderPresetsTab();
    });

    /* ==========================================================================
       TAB NAVIGATION CONTROLLER
       ========================================================================== */
    function switchTab(tabName) {
      const tabs = ['itinerary', 'presets', 'assistant'];
      tabs.forEach(t => {
        const content = document.getElementById(`tab-content-${t}`);
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tabName) {
          content.classList.remove('hidden');
          btn.classList.add('text-brand-400', 'bg-slate-700/80', 'shadow-sm');
          btn.classList.remove('text-slate-400');
        } else {
          content.classList.add('hidden');
          btn.classList.remove('text-brand-400', 'bg-slate-700/80', 'shadow-sm');
          btn.classList.add('text-slate-400');
        }
      });
    }

    /* ==========================================================================
       DISTANCE & TRANSPORTATION CALCULATOR ENGINE
       ========================================================================== */
    // Calculate approximate geodesic distance in KM using Haversine formula
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Generate comprehensive transport modes options between Spot A and Spot B
    function evaluateTransportModes(spotA, spotB) {
      const dist = calculateDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
      
      const modes = [];

      // 1. High Speed Rail (THSR) / TRA Express Train
      if (dist > 60) {
        modes.push({
          id: 'thsr',
          name: '高鐵 THSR + 接駁',
          icon: 'fa-solid fa-train-subway text-blue-400',
          timeMinutes: Math.round(dist * 0.45 + 30),
          costNTD: Math.round(dist * 2.8 + 100),
          badge: '⚡ 最快迅速',
          badgeClass: 'bg-blue-500/20 text-blue-400 border-blue-500/30',
          recommendReason: '跨縣市距離較長，搭乘高鐵可大幅縮短拉車時間！'
        });
      }

      // 2. Metro MRT / Public Transit
      if (dist <= 30) {
        modes.push({
          id: 'mrt',
          name: '捷運 MRT / 市區公車',
          icon: 'fa-solid fa-train text-emerald-400',
          timeMinutes: Math.round(dist * 2.8 + 12),
          costNTD: Math.round(Math.min(65, dist * 2.5 + 20)),
          badge: '💰 最划算經濟',
          badgeClass: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
          recommendReason: '都市區班次密集不塞車，省錢首選！'
        });
      }

      // 3. Charter Car / Taxi
      modes.push({
        id: 'taxi',
        name: '包車 / 計程車 / 租車',
        icon: 'fa-solid fa-taxi text-amber-400',
        timeMinutes: Math.round(dist * 1.2 + 10),
        costNTD: Math.round(dist * 18 + 120),
        badge: '🚘 直達最舒適',
        badgeClass: 'bg-amber-500/20 text-amber-400 border-amber-500/30',
        recommendReason: '適合多人同行分攤車資，專車直達免轉乘！'
      });

      // 4. Tourist Bus / Express Bus
      modes.push({
        id: 'bus',
        name: '台灣好行 / 客運巴士',
        icon: 'fa-solid fa-bus text-purple-400',
        timeMinutes: Math.round(dist * 1.8 + 15),
        costNTD: Math.round(dist * 1.8 + 30),
        badge: '🚌 觀光客首選',
        badgeClass: 'bg-purple-500/20 text-purple-400 border-purple-500/30',
        recommendReason: '專為觀光景點設計路線，沿途欣賞風光！'
      });

      // 5. Walking / Scooter (Short Distance)
      if (dist <= 5) {
        modes.push({
          id: 'walk',
          name: '步行 / 騎乘 YouBike 共享單車',
          icon: 'fa-solid fa-person-walking text-teal-400',
          timeMinutes: Math.round(dist * 14),
          costNTD: Math.round(dist * 10),
          badge: '🌱 環保漫遊',
          badgeClass: 'bg-teal-500/20 text-teal-400 border-teal-500/30',
          recommendReason: '距離近，漫步巷弄體驗當地生活氣息！'
        });
      }

      // Sort by travel time ascending
      modes.sort((a, b) => a.timeMinutes - b.timeMinutes);
      return { distKm: dist.toFixed(1), modes };
    }

    /* ==========================================================================
       RENDER ITINERARY & DYNAMIC TRANSPORT LEGS
       ========================================================================== */
    function renderItinerary() {
      const container = document.getElementById('itinerary-list-container');
      const spotCountEl = document.getElementById('spot-count');
      const totalEstEl = document.getElementById('total-travel-est');

      spotCountEl.innerText = currentItinerary.length;

      if (currentItinerary.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 px-4 glass-card rounded-2xl border border-dashed border-slate-800 space-y-3">
            <div class="w-12 h-12 mx-auto rounded-full bg-slate-800 text-slate-500 flex items-center justify-center text-xl">
              <i class="fa-solid fa-map-location-dot"></i>
            </div>
            <div>
              <p class="text-sm font-semibold text-slate-300">目前尚無排定行程</p>
              <p class="text-xs text-slate-500 mt-1">請點擊上方「熱門方案」選擇或點擊「加景點」自訂</p>
            </div>
            <button onclick="switchTab('presets')" class="px-4 py-2 bg-brand-500/20 text-brand-400 rounded-xl text-xs font-semibold border border-brand-500/30">
              探索熱門行程方案
            </button>
          </div>
        `;
        totalEstEl.innerHTML = `<i class="fa-regular fa-clock"></i> 預估移動約 0 分鐘`;
        return;
      }

      let totalMinutes = 0;
      let html = '';

      currentItinerary.forEach((spot, idx) => {
        // 1. Render Attraction Card
        html += `
          <div class="glass-card rounded-2xl p-3 border border-slate-800 relative group hover:border-slate-700 transition">
            <div class="flex items-center gap-3">
              <!-- Spot Order Badge -->
              <div class="w-7 h-7 rounded-xl bg-slate-800 border border-slate-700 text-brand-400 font-extrabold text-xs flex items-center justify-center shrink-0">
                ${idx + 1}
              </div>

              <!-- Spot Photo -->
              <img src="${spot.img}" class="w-20 h-20 rounded-xl object-cover shrink-0 bg-slate-800 border border-slate-700/50" alt="${spot.name}" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=300'">

              <!-- Spot Information -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5">
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 border border-slate-700">
                    ${spot.region || '台灣'}
                  </span>
                  <h3 class="text-xs sm:text-sm font-bold text-white truncate">${spot.name}</h3>
                </div>
                <p class="text-[11px] text-slate-400 mt-1 line-clamp-2 leading-snug">${spot.desc}</p>
              </div>

              <!-- Card Action Controls -->
              <div class="flex flex-col gap-1 shrink-0">
                ${idx > 0 ? `<button onclick="moveSpot(${idx}, -1)" class="p-1.5 text-slate-400 hover:text-brand-400 text-xs rounded-lg bg-slate-800/60" title="上移"><i class="fa-solid fa-chevron-up"></i></button>` : ''}
                ${idx < currentItinerary.length - 1 ? `<button onclick="moveSpot(${idx}, 1)" class="p-1.5 text-slate-400 hover:text-brand-400 text-xs rounded-lg bg-slate-800/60" title="下移"><i class="fa-solid fa-chevron-down"></i></button>` : ''}
                <button onclick="removeSpot(${idx})" class="p-1.5 text-slate-400 hover:text-red-400 text-xs rounded-lg bg-slate-800/60" title="刪除"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
          </div>
        `;

        // 2. Render Transport Connector Leg to Next Spot
        if (idx < currentItinerary.length - 1) {
          const nextSpot = currentItinerary[idx + 1];
          const transportInfo = evaluateTransportModes(spot, nextSpot);
          const topRecommended = transportInfo.modes[0]; // Fastest mode
          totalMinutes += topRecommended.timeMinutes;

          const googleMapsLegUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(spot.name)}&destination=${encodeURIComponent(nextSpot.name)}&travelmode=transit`;

          html += `
            <div class="my-1.5 px-4 py-2 bg-slate-950/60 rounded-xl border border-slate-800/80 flex items-center justify-between text-xs gap-2">
              <div class="flex items-center gap-2 overflow-hidden">
                <div class="w-2 h-2 rounded-full bg-brand-400 animate-pulse"></div>
                <div class="truncate">
                  <span class="text-slate-400 text-[11px]">前往下一站約 <span class="text-brand-400 font-bold">${transportInfo.distKm} km</span></span>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    <i class="${topRecommended.icon} text-xs"></i>
                    <span class="font-bold text-slate-200 text-[11px]">${topRecommended.name} (${topRecommended.timeMinutes}分)</span>
                    <span class="text-[9px] px-1.5 py-0.2 rounded ${topRecommended.badgeClass}">${topRecommended.badge}</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-1 shrink-0">
                <button onclick="openTransportModal(${idx})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-[10px] font-medium border border-slate-700 transition">
                  <i class="fa-solid fa-sliders"></i> 評估
                </button>
                <a href="${googleMapsLegUrl}" target="_blank" class="px-2 py-1 bg-brand-500/20 hover:bg-brand-500/30 text-brand-400 rounded-lg text-[10px] font-semibold border border-brand-500/30 flex items-center gap-1 transition">
                  <i class="fa-brands fa-chrome text-[10px]"></i> 導航
                </a>
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html;
      totalEstEl.innerHTML = `<i class="fa-regular fa-clock"></i> 預估交通時間約 <span class="text-brand-400 font-bold">${totalMinutes}</span> 分鐘`;
    }

    /* ==========================================================================
       TRANSPORT MODAL COMPARISON BUILDER
       ========================================================================== */
    function openTransportModal(idx) {
      const spotA = currentItinerary[idx];
      const spotB = currentItinerary[idx + 1];
      if (!spotA || !spotB) return;

      document.getElementById('modal-route-title').innerText = `${spotA.name} ➔ ${spotB.name}`;
      
      const { distKm, modes } = evaluateTransportModes(spotA, spotB);
      const container = document.getElementById('modal-transport-options');

      container.innerHTML = modes.map((m, mIdx) => `
        <div class="p-3 bg-slate-950 rounded-xl border ${mIdx === 0 ? 'border-brand-500/40 bg-brand-950/10' : 'border-slate-800'} space-y-2">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i class="${m.icon} text-base"></i>
              <span class="font-bold text-white text-xs sm:text-sm">${m.name}</span>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${m.badgeClass}">${m.badge}</span>
          </div>

          <div class="flex items-center justify-between text-xs text-slate-300">
            <span>⏱️ 預估時間: <strong class="text-brand-400">${m.timeMinutes} 分鐘</strong></span>
            <span>💰 預估花費: <strong class="text-amber-400">NT$ ${m.costNTD}</strong></span>
          </div>

          <p class="text-[11px] text-slate-400 bg-slate-900/80 p-2 rounded-lg leading-relaxed">
            💡 ${m.recommendReason}
          </p>
        </div>
      `).join('');

      const mapUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(spotA.name)}&destination=${encodeURIComponent(spotB.name)}&travelmode=transit`;
      document.getElementById('modal-google-maps-btn').setAttribute('onclick', `window.open('${mapUrl}', '_blank')`);

      document.getElementById('transport-modal').classList.remove('hidden');
    }

    function closeTransportModal() {
      document.getElementById('transport-modal').classList.add('hidden');
    }

    /* ==========================================================================
       FULL DAY MULTI-STOP CHROME / GOOGLE MAPS DIRECT LINK GENERATOR
       ========================================================================== */
    function openFullDayMaps() {
      if (currentItinerary.length < 2) {
        alert('請先加入至少 2 個景點以生成完整導航路線！');
        return;
      }

      const origin = encodeURIComponent(currentItinerary[0].name);
      const destination = encodeURIComponent(currentItinerary[currentItinerary.length - 1].name);

      let waypointsParam = '';
      if (currentItinerary.length > 2) {
        const waypoints = currentItinerary.slice(1, currentItinerary.length - 1).map(s => encodeURIComponent(s.name)).join('|');
        waypointsParam = `&waypoints=${waypoints}`;
      }

      // Universal Google Maps URL format supported seamlessly on Chrome Mobile and Maps App
      const fullMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypointsParam}&travelmode=driving`;
      window.open(fullMapsUrl, '_blank');
    }

    /* ==========================================================================
       ITINERARY MODIFICATION CONTROLLERS
       ========================================================================== */
    function moveSpot(index, direction) {
      const newIndex = index + direction;
      if (newIndex >= 0 && newIndex < currentItinerary.length) {
        const temp = currentItinerary[index];
        currentItinerary[index] = currentItinerary[newIndex];
        currentItinerary[newIndex] = temp;
        renderItinerary();
      }
    }

    function removeSpot(index) {
      currentItinerary.splice(index, 1);
      renderItinerary();
    }

    function confirmClearAll() {
      if (currentItinerary.length === 0) return;
      if (confirm('確定要清空當前的所有行程嗎？')) {
        currentItinerary = [];
        renderItinerary();
      }
    }

    function loadPresetRoute(pkgId) {
      const pkg = PRESET_PACKAGES.find(p => p.id === pkgId);
      if (!pkg) return;

      currentItinerary = pkg.spots.map(spotId => {
        const spot = TAIWAN_SPOTS_DB.find(s => s.id === spotId);
        return { ...spot };
      });

      document.getElementById('current-route-title').innerText = pkg.title;
      renderItinerary();
      switchTab('itinerary');
    }

    /* ==========================================================================
       RENDER PRESETS & SPOT EXPLORER DATABASE
       ========================================================================== */
    function renderPresetsTab() {
      const container = document.getElementById('presets-grid');
      container.innerHTML = PRESET_PACKAGES.map(pkg => `
        <div class="glass-card rounded-2xl p-4 border border-slate-800 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-gradient-to-r ${pkg.tagColor} text-white shadow-sm">
              ${pkg.tag}
            </span>
            <span class="text-xs text-slate-400"><i class="fa-solid fa-location-dot text-brand-400"></i> ${pkg.spots.length} 個行程景點</span>
          </div>

          <div>
            <h3 class="text-sm font-bold text-white">${pkg.title}</h3>
            <p class="text-xs text-slate-400 mt-0.5">${pkg.subtitle}</p>
          </div>

          <div class="grid grid-cols-4 gap-1.5 pt-1">
            ${pkg.spots.map(sId => {
              const spot = TAIWAN_SPOTS_DB.find(s => s.id === sId);
              return `<img src="${spot.img}" class="w-full h-14 rounded-lg object-cover bg-slate-800" alt="${spot.name}">`;
            }).join('')}
          </div>

          <button onclick="loadPresetRoute('${pkg.id}')" class="w-full py-2 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition shadow-md flex items-center justify-center gap-1">
            <i class="fa-solid fa-circle-check"></i> 套用此熱門方案
          </button>
        </div>
      `).join('');
    }

    function renderExplorerGrid() {
      const container = document.getElementById('spot-explorer-grid');
      container.innerHTML = TAIWAN_SPOTS_DB.map(spot => `
        <div class="glass-card rounded-xl p-2 border border-slate-800 flex flex-col justify-between space-y-2">
          <img src="${spot.img}" class="w-full h-20 rounded-lg object-cover" alt="${spot.name}">
          <div>
            <div class="flex items-center gap-1">
              <span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 border border-slate-700">${spot.region}</span>
              <h5 class="text-xs font-bold text-slate-100 truncate">${spot.name}</h5>
            </div>
            <p class="text-[10px] text-slate-400 line-clamp-1 mt-0.5">${spot.desc}</p>
          </div>
          <button onclick="addSpotToItinerary('${spot.id}')" class="w-full py-1.5 bg-slate-800 hover:bg-brand-500 hover:text-slate-950 text-slate-300 text-[11px] font-semibold rounded-lg border border-slate-700 transition">
            + 加入行程
          </button>
        </div>
      `).join('');
    }

    function addSpotToItinerary(spotId) {
      const spot = TAIWAN_SPOTS_DB.find(s => s.id === spotId);
      if (spot) {
        currentItinerary.push({ ...spot });
        renderItinerary();
        switchTab('itinerary');
      }
    }

    /* ==========================================================================
       AI ASSISTANT INTERACTIVE LOGIC
       ========================================================================== */
    function askAIAssistant(promptText) {
      document.getElementById('ai-query-input').value = promptText;
      handleAISubmit();
    }

    function handleAISubmit() {
      const input = document.getElementById('ai-query-input');
      const text = input.value.trim();
      if (!text) return;

      const outputBox = document.getElementById('ai-output-box');
      
      // Match query with database keyword or generate dynamic suggestion
      let matchedSpot = TAIWAN_SPOTS_DB.find(s => text.includes(s.name) || text.includes(s.region) || text.includes(s.city));
      if (!matchedSpot) {
        matchedSpot = TAIWAN_SPOTS_DB[Math.floor(Math.random() * TAIWAN_SPOTS_DB.length)];
      }

      outputBox.innerHTML = `
        <div class="space-y-2 animate-in fade-in duration-300">
          <div class="flex items-center gap-2 text-purple-400 font-bold">
            <i class="fa-solid fa-sparkles"></i> AI 助手特選推薦：
          </div>
          <div class="p-2.5 bg-slate-900 rounded-xl border border-purple-500/30 space-y-2">
            <div class="flex items-center gap-2">
              <img src="${matchedSpot.img}" class="w-12 h-12 rounded-lg object-cover" alt="${matchedSpot.name}">
              <div>
                <h5 class="font-bold text-white text-xs">${matchedSpot.name} (${matchedSpot.city})</h5>
                <p class="text-[10px] text-slate-400">${matchedSpot.desc}</p>
              </div>
            </div>
            <button onclick="addSpotToItinerary('${matchedSpot.id}')" class="w-full py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-lg text-xs font-semibold shadow transition">
              <i class="fa-solid fa-plus mr-1"></i> 將「${matchedSpot.name}」加入我的行程
            </button>
          </div>
        </div>
      `;

      input.value = '';
    }

    /* ==========================================================================
       MODAL CONTROLLERS FOR CUSTOM SPOTS
       ========================================================================== */
    function openAddSpotModal() {
      document.getElementById('add-spot-modal').classList.remove('hidden');
    }

    function closeAddSpotModal() {
      document.getElementById('add-spot-modal').classList.add('hidden');
    }

    function submitCustomSpot() {
      const name = document.getElementById('custom-name').value.trim();
      const desc = document.getElementById('custom-desc').value.trim();
      const img = document.getElementById('custom-img').value.trim();
      const region = document.getElementById('custom-region').value;

      if (!name) {
        alert('請輸入景點名稱！');
        return;
      }

      const newSpot = {
        id: 'custom-' + Date.now(),
        name: name,
        region: region,
        city: '自訂地點',
        lat: 25.033976, // Default Taipei baseline
        lng: 121.564538,
        desc: desc || '使用者個人手動新增的特色私房景點',
        img: img || 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=600&auto=format&fit=crop&q=80'
      };

      currentItinerary.push(newSpot);
      renderItinerary();
      closeAddSpotModal();
      switchTab('itinerary');

      // Clear input fields
      document.getElementById('custom-name').value = '';
      document.getElementById('custom-desc').value = '';
      document.getElementById('custom-img').value = '';
    }
  </script>
